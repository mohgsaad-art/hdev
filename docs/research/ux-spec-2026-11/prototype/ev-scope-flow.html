<style>

:root{--bg:#eceff4;--surface:#fff;--ink:#1c2533;--muted:#5f6b7e;--line:#d3d9e3;--blue:#1f4e9e;--blue-ink:#fff;--blue-soft:#e6edf8;--bar:#1f4e9e;--bar-ink:#fff;--red:#c0392b;--red-bg:#fbeceb;--amber:#b57a00;--amber-bg:#fdf5df;--green:#2e7d4f;--ctl:#f3f5f9;--sh-d:rgba(20,35,60,.16);--sh-l:#fff;--overlay:rgba(20,30,50,.45);--font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121821;--surface:#1b2331;--ink:#e6ebf3;--muted:#93a0b4;--line:#323d50;--blue:#7aa5ea;--blue-ink:#0e1726;--blue-soft:#22324d;--bar:#17315f;--bar-ink:#eef3fb;--red:#ef8174;--red-bg:#3a1f1d;--amber:#e6b84a;--amber-bg:#3a3018;--green:#6cc595;--ctl:#252e3d;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.05);--overlay:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121821;--surface:#1b2331;--ink:#e6ebf3;--muted:#93a0b4;--line:#323d50;--blue:#7aa5ea;--blue-ink:#0e1726;--blue-soft:#22324d;--bar:#17315f;--bar-ink:#eef3fb;--red:#ef8174;--red-bg:#3a1f1d;--amber:#e6b84a;--amber-bg:#3a3018;--green:#6cc595;--ctl:#252e3d;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.05);--overlay:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-block:0}
h1{font-size:21px;font-weight:600;margin:0;text-wrap:balance}

}

.chip.ok{color:var(--green);border-color:var(--green)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:500;text-align:left;padding:4px 6px;vertical-align:bottom}
td{padding:5px 6px;vertical-align:middle}
tbody tr+tr td{border-top:1px solid var(--line)}
.row-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.bulk{background:var(--ctl);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bulk select{width:170px}
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbar select{width:min(360px,100%);font-weight:600}
.sumcard{display:flex;gap:22px;flex-wrap:wrap;align-items:center}

.savebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--ch,96px) + 6px);z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}

.drow small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#side{position:fixed;right:0;top:calc(env(safe-area-inset-top,0px) + var(--ch,96px));bottom:0;width:min(360px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px var(--sh-d);z-index:52;display:flex;flex-direction:column}
#side .tabs{display:flex;border-bottom:1px solid var(--line);align-items:center;padding:0 8px}

#side .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}

#side .body{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px}

.psec+.psec{padding-top:12px;border-top:1px solid var(--line)}

.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:80}
.dlg{background:var(--surface);border-radius:12px;width:min(660px,100%);box-shadow:0 20px 60px var(--sh-d);border:1px solid var(--line)}
.dlg.wide{width:min(1000px,100%)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.db{padding:16px;display:flex;flex-direction:column;gap:14px}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.starts{display:flex;flex-direction:column;gap:8px}
.starts label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:90;max-width:calc(100vw - 32px)}
textarea{height:110px;resize:vertical}
.verdict{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

</div>

/* ===== FIELD SPECS =====

      return el('tr',{},el('td',{},v.name||'Unnamed vehicle'),COSTV.map(function(f){return el('td',{},control(o,f.k,{type:'num',nd:true,ph:'',dataK:'cv.'+v.id+'.'+f.k}).c)}),
        el('td',{},el('button',{class:'btn sm',type:'button',onclick:function(){var b=el('div',{class:'fgrid'});var pre=PRE;PRE='cvx.';COSTVX.forEach(function(f){b.append(fieldEl(Object.assign({nd:true},f),o))});PRE=pre;modal((v.name||'Vehicle')+' · more costs',b,function(close){return [el('span',{class:'sp'}),el('button',{class:'btn primary',type:'button',onclick:close},'Done')]})}},'More')))})))));
}

        y8?el('span',{class:'chip a'},'Guarantee not given'):null)};

      el('h3',{},'Checks'),el('div',{class:'cards'},CHECKS.map(card)),

  }

/* ===== CHECK ===== */
var CK={R:[],Y:[]};
function compute(){
  var R=[],Y=[],cur='';
  function red(g,t,go,id){R.push({g:g,text:t,go:go,id:id,pg:cur})}
  function yel(g,t,go,id){Y.push({g:g,text:t,go:go,id:id,pg:cur})}
  function cards(G,obj,list,goFn,id,skip){
    list.forEach(function(c){if(c.show&&!c.show(obj))return;if(skip&&skip(c))return;var defs={};
      walk(c,obj,function(f,det){
        if(f.t==='note'||f.t==='auto'||f.t==='cards'||!empty(obj[f.k]))return;
        var target=det?'det.'+det.id:f.k;
        if(isReq(f,obj))red(G,f.l+' missing',goFn(target),id);
        else if(!f.nd){var key=det?det.id:c.id;if(!defs[key])defs[key]={n:0,t:target,name:det?det.title:c.title};defs[key].n++}});
      Object.keys(defs).forEach(function(k){var d=defs[k];yel(G,d.name+': '+d.n+' default'+(d.n>1?'s':'')+' used',goFn(d.t),id)})})}
  function pgGo(page,pre){return function(t){return function(){go(page,function(){flash('[data-k="'+(t.indexOf('det.')===0?t:pre+t)+'"]')})}}}
  cur='fleet';
  if(active('fleet')){
    if(!S.groups.length)red('Fleet groups','Add at least one fleet group',function(){go('fleet')});
    S.groups.forEach(function(g,i){var n=g.name||'Group '+(i+1);
      [['vehicle','vehicle'],['schedule','schedule']].concat(P.start===2?[]:[['route','route']]).forEach(function(p){
        if(!g[p[0]])red('Fleet groups',n+': '+p[1]+' not chosen',function(){go('fleet',function(){flash('[data-k="'+g.id+'.'+p[0]+'"]')})})});
      if(P.start===2&&empty(g.kwhDay))red('Fleet groups',n+': energy per day missing',function(){go('fleet',function(){flash('[data-k="'+g.id+'.kwhDay"]')})});
      if(!(+g.count>0))red('Fleet groups',n+': number of vehicles missing',function(){go('fleet',function(){flash('[data-k="'+g.id+'.count"]')})})});
  }
  cur='vehicles';
  if(active('vehicles')){
    if(!S.vehicles.length&&!active('fleet'))red('Vehicles','Add at least one vehicle',function(){go('vehicles')});
    eff('vehicle').forEach(function(v){var G='Vehicle · '+(v.name||'Unnamed');
      cards(G,v,VCARDS,function(t){return function(){goObj('vehicles','selVeh',v.id,t.indexOf('det.')===0?t:'v.'+t)}},v.id,function(c){return batOnly()&&!c.bat&&c.id!=='id'});
      if(empty(v.guar))yel(G,'Year-8 check: guarantee not given',function(){goObj('vehicles','selVeh',v.id,'v.guar')},v.id)});
  }
  cur='routes';
  if(active('routes'))eff('route').forEach(function(r){var G='Route · '+(r.name||'Unnamed');
    var gof=function(t){return function(){goObj('routes','selRoute',r.id,t.indexOf('det.')===0?t:/^s\d+\./.test(t)||t==='r.backKm'||t==='r.name'?t:'r.'+t)}};
    if(r.builtin){if(S.groups.some(function(g){return g.route===r.id}))cards(G,r,[RCARDS[0]],gof,r.id);return}
    if(empty(r.name))red(G,'Route name missing',gof('r.name'),r.id);
    var nd=0,fs='';
    r.stops.forEach(function(s,i){var n=i+1;
      if(empty(s.km))red(G,'Stop '+n+': distance missing',gof('s'+n+'.km'),r.id);
      if(empty(s.road))red(G,'Stop '+n+': road type missing',gof('s'+n+'.road'),r.id);
      if(r.plShape==='Per stop'&&empty(s.pl))red(G,'Stop '+n+': payload missing',gof('s'+n+'.pl'),r.id);
      if(empty(s.dwell)){nd++;fs=fs||('s'+n+'.dwell')}});
    if(empty(r.backKm))red(G,'Distance back at the depot missing',gof('r.backKm'),r.id);
    if(nd)yel(G,nd+' stop'+(nd>1?'s':'')+' with no time at stop (default used)',gof(fs),r.id);
    cards(G,r,RCARDS,gof,r.id);
  });
  cur='schedules';
  if(active('schedules'))eff('schedule').forEach(function(s){var G='Schedule · '+(s.name||'Unnamed');
    if(!s.days.some(Boolean))red(G,'No working days chosen',function(){goObj('schedules','selSched',s.id,'sc.days')},s.id);
    cards(G,s,SCARDS,function(t){return function(){goObj('schedules','selSched',s.id,t.indexOf('det.')===0?t:'sc.'+t)}},s.id)});
  cur='weather';if(active('weather'))cards('Weather',S.wx,WCARDS,pgGo('weather','wx.'));
  cur='depot';if(active('depot'))cards('Depot and grid',S.dep,DCARDS,pgGo('depot','dep.'));
  cur='charging';if(active('charging'))cards('Charging',S.dep,CHCARDS,pgGo('charging','ch.'));
  cur='flex';if(active('flex'))cards('Flexibility',S.dep,FCARDS,pgGo('flex','fx.'));
  cur='prices';if(active('prices'))cards('Prices',S.price,PCARDS,pgGo('prices','pr.'));
  cur='costs';if(active('costs'))cards('Costs',S.cost,CCARDS,pgGo('costs','co.'));
  cur='tax';if(active('tax'))cards('Tax and CO₂',S.tax,TXCARDS,pgGo('tax','tx.'));
  cur='tender';if(active('tender'))cards('Tender',S.ten,TCARDS,pgGo('tender','tn.'));
  return {R:R,Y:Y};
}
function updateCheck(){CK=compute();$('#nr').textContent=CK.R.length;$('#na').textContent=CK.Y.length;$('#run').classList.toggle('off',CK.R.length>0);if(!$('#side').hidden&&sideTab==='check')drawSide();drawIndex();drawStages()}
