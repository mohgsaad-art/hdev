<title>EV Scope Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one top bar (project, scenario, steps, Check, Run). One page under it, in plain sections. Named popups only for expert inputs and tables. */
:root{--bg:#eceff4;--surface:#fff;--ink:#1c2533;--muted:#6a7587;--line:#d3d9e3;--blue:#1f4e9e;--blue-ink:#fff;--blue-soft:#e6edf8;--red:#c0392b;--red-bg:#fbeceb;--amber:#c98a00;--amber-bg:#fdf5df;--ctl:#f3f5f9;--sh-d:rgba(20,35,60,.16);--sh-l:#fff;--overlay:rgba(20,30,50,.45);--font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121821;--surface:#1b2331;--ink:#e6ebf3;--muted:#93a0b4;--line:#323d50;--blue:#7aa5ea;--blue-ink:#0e1726;--blue-soft:#22324d;--red:#ef8174;--red-bg:#3a1f1d;--amber:#e6b84a;--amber-bg:#3a3018;--ctl:#252e3d;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.05);--overlay:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121821;--surface:#1b2331;--ink:#e6ebf3;--muted:#93a0b4;--line:#323d50;--blue:#7aa5ea;--blue-ink:#0e1726;--blue-soft:#22324d;--red:#ef8174;--red-bg:#3a1f1d;--amber:#e6b84a;--amber-bg:#3a3018;--ctl:#252e3d;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.05);--overlay:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1{font-size:20px;font-weight:600;margin:0 0 14px}
h2{font-size:16px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:600;color:var(--blue)}
#pname{width:220px;flex:0 1 220px}
#scen{width:auto;flex:0 0 auto}
.saved{font-size:12px;color:var(--muted)}
.sp{flex:1}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px;scrollbar-width:thin}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;white-space:nowrap;color:var(--muted);font-weight:500}
nav button[aria-current="page"]{color:var(--blue);border-bottom-color:var(--blue)}
nav button.off{opacity:.4}
nav button:hover{color:var(--ink)}
input,select{font:inherit;color:var(--ink);background:var(--ctl);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%;box-shadow:inset 1px 1px 3px var(--sh-d),inset -1px -1px 2px var(--sh-l)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=checkbox],input[type=radio]{width:17px;height:17px;padding:0;accent-color:var(--blue);box-shadow:none;flex:none}
input[type=file]{padding:5px}
input:disabled{opacity:.5}
.need{border-color:var(--red)!important;background:var(--red-bg)!important}
.def{border-left:3px solid var(--amber)!important}
.edited{color:var(--blue);font-weight:500}
.btn{background:var(--ctl);border:1px solid var(--line);border-radius:6px;padding:7px 12px;box-shadow:1px 1px 3px var(--sh-d),-1px -1px 2px var(--sh-l);font-weight:500;white-space:nowrap}
.btn:active{box-shadow:inset 1px 1px 3px var(--sh-d)}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.warn{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.pill{display:flex;align-items:center;gap:7px;padding:6px 12px}
#run.off{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.r{background:var(--red)}.dot.a{background:var(--amber)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.frow{display:flex;align-items:center;gap:6px}
.unit{color:var(--muted);font-size:13px;min-width:22px;white-space:nowrap}
.rst{border:0;background:none;color:var(--blue);font-size:16px;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap;padding:6px 4px;border-radius:6px}
.checks label{display:flex;gap:6px;align-items:center}
.auto{padding:7px 0;color:var(--muted)}
.tbtn{text-align:left}
.pg{padding-top:20px;max-width:1120px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:500;text-align:left;padding:4px 6px;vertical-align:bottom}
td{padding:5px 6px;vertical-align:middle}
tbody tr+tr td{border-top:1px solid var(--line)}
.row-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.bulk{background:var(--ctl);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bulk select{width:170px}
.muted{color:var(--muted)}
.split{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:2px}
.list button{text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;display:flex;align-items:center;gap:8px}
.list button[aria-current="true"]{background:var(--blue-soft);color:var(--blue);font-weight:600}
.list .gh{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 10px 2px;font-weight:600}
.strip{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--ctl)}
.strip .sum{font-size:13px;color:var(--muted)}
.strip svg{width:100%;height:54px;display:block}
.strip text{fill:var(--muted);font:11px var(--font)}
.strip line{stroke:var(--line);stroke-width:2}
.strip .n{fill:var(--blue)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:46px}
.days button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.days.need{border:1px solid var(--red);border-radius:8px;padding:4px;background:var(--red-bg)}
.note{color:var(--muted);font-size:13px}
.later{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.flash{animation:fl 1.6s}
@keyframes fl{0%,60%{outline:3px solid var(--blue);outline-offset:2px}100%{outline:3px solid transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--blue)}}
#panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 54px);width:min(400px,calc(100vw - 32px));max-height:72vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px var(--sh-d);padding:14px;z-index:40}
.psec+.psec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.psec h3{display:flex;gap:7px;align-items:center;margin-bottom:4px}
.pg-h{font-size:12px;color:var(--muted);margin:8px 0 2px;font-weight:600}
.pitem{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:5px 8px}
.pitem:hover{background:var(--ctl)}
#menu{position:absolute;right:0;top:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 30px var(--sh-d);padding:4px;min-width:210px;z-index:41}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px}
#menu button:hover{background:var(--ctl)}
.mwrap{position:relative}
.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:50}
.dlg{background:var(--surface);border-radius:12px;width:min(600px,100%);box-shadow:0 20px 60px var(--sh-d);border:1px solid var(--line)}
.dlg.wide{width:min(1000px,100%)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.db{padding:16px;display:flex;flex-direction:column;gap:14px}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.df .sp{flex:1}
.starts{display:flex;flex-direction:column;gap:8px}
.starts label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.starts label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.starts b{display:block;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;max-width:calc(100vw - 32px)}
textarea{font:12px/1.4 ui-monospace,monospace;width:100%;height:220px;background:var(--ctl);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.verdict{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.verdict .big{font-size:22px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rc .q{font-weight:500}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;align-self:flex-start;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.run{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}
.chip.y8{color:var(--amber);border-color:var(--amber);background:var(--amber-bg)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 140px;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .u{color:var(--muted);font-size:13px}
.stops td select{min-width:130px}
@media (max-width:640px){.rrow{grid-template-columns:1fr}}
</style>

<header class="top">
  <div class="trow">
    <span class="brand">EV Scope</span>
    <input id="pname" placeholder="Untitled project" aria-label="Project name">
    <select id="scen" aria-label="Scenario"></select>
    <span class="saved" id="saved">Saved</span>
    <span class="sp"></span>
    <button id="ckb" class="btn pill" type="button" title="Red: needed before Run. Amber: defaults or no data given."><span class="dot r"></span><b id="nr">0</b><span class="dot a"></span><b id="na">0</b><span>Check</span></button>
    <button id="run" class="btn primary" type="button">Run</button>
    <div class="mwrap"><button id="more" class="btn" type="button" aria-label="Project menu">⋯</button><div id="menu" hidden></div></div>
  </div>
  <nav id="nav" aria-label="Steps"></nav>
</header>
<main id="page"></main>
<div id="panel" hidden></div>
<div id="layer"></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
var KEY='evscope-flow-v3';
var uid=1;
function nid(p){return p+(uid++)+Math.random().toString(36).slice(2,6)}
function $(s,r){return (r||document).querySelector(s)}
function el(tag,attrs){
  var e=document.createElement(tag);attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){var v=attrs[k];
    if(v===false||v==null)return;
    if(k==='class')e.className=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else e.setAttribute(k,v)});
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);
  return e;
}
function add(e,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(e,x)});return}e.append(c.nodeType?c:document.createTextNode(c))}
function fill(e){var a=[].slice.call(arguments,1);e.replaceChildren();add(e,a);return e}
function empty(v){return v===''||v==null||(Array.isArray(v)&&!v.length)}
function clone(o){return JSON.parse(JSON.stringify(o))}
var YN=['Yes','No'];

/* ======================= INPUTS (curated from inputs_ux.csv) =======================
   k key, l label, t type (num text time date select checks file table auto), u unit, o options,
   req true/function, show function, rb rebuild on change, nd = empty is a real answer (no amber), cols for tables, x = expert popup */
var GROUPS=['1','1s','2','3','4','5','9','10','11','12','16','51','52','53','54','55','56'];
var BODY=['Box B-II','Box B1','Box B2','Box B3','Box B4','Box B5','Tipper BT1','Tipper BT2','Tipper BT3','Refuse MU4','Refuse MU9','Refuse MU11','Own'];
var TRAILER=['None','T1','T2','ST1','Dolly','STT1','STT2','Own'];
function is(k,v){return function(o){return o[k]===v}}
function isAny(k,vs){return function(o){return vs.indexOf(o[k])>=0}}
var PROFILE=[{k:'t',l:'Time',t:'num',u:'s'},{k:'p',l:'Power',t:'num',u:'kW'}];

var VSEC=[
  {id:'weights',title:'Weights and body',f:[
    {k:'curb',l:'Empty weight of the chassis',t:'num',u:'kg',req:true},
    {k:'gvw',l:'Gross vehicle weight',t:'num',u:'kg',req:true},
    {k:'bodyType',l:'Body',t:'select',o:BODY},
    {k:'bodyW',l:'Body weight',t:'num',u:'kg'},
    {k:'trailerType',l:'Trailer',t:'select',o:TRAILER,rb:true},
    {k:'trailW',l:'Trailer weight',t:'num',u:'kg',show:function(o){return o.trailerType&&o.trailerType!=='None'}},
    {k:'height',l:'Vehicle height',t:'num',u:'m'}]},
  {id:'tyres',title:'Tyres',f:[
    {k:'tsize',l:'Tyre size',t:'text',req:true},
    {k:'rrcSrc',l:'Rolling resistance from',t:'select',o:['Typed value','EU tyre label class','VECTO standard value'],rb:true},
    {k:'crr',l:'Rolling resistance',t:'num',u:'N/kN',req:true,show:is('rrcSrc','Typed value')},
    {k:'rrcClass',l:'Tyre label class',t:'select',o:['A','B','C','D','E'],req:true,show:is('rrcSrc','EU tyre label class')},
    {k:'cold',l:'Cold-tyre correction',t:'select',o:['Off','On']},
    {k:'road',l:'Wet, snow or ice',t:'select',o:['Off','From weather data']}],
   x:[{k:'loadIdx',l:'Tyre load index',t:'num'},{k:'wheelJ',l:'Wheel inertia',t:'num',u:'kg·m²'}]},
  {id:'aero',title:'Air drag',f:[{k:'cdxa',l:'Air drag area, CdxA',t:'num',u:'m²'}],
   x:[{k:'yawSet',l:'Crosswind coefficient set',t:'select',o:['VECTO standard','Own']},
      {k:'cdA',l:'Coast-down A',t:'num'},{k:'cdB',l:'Coast-down B',t:'num'},{k:'cdC',l:'Coast-down C',t:'num'}]},
  {id:'drive',title:'Drivetrain',f:[
    {k:'driveP',l:'Largest drive power',t:'num',u:'kW',req:true},
    {k:'regenP',l:'Largest regeneration power',t:'num',u:'kW',req:true},
    {k:'lossHow',l:'Drivetrain losses from',t:'select',o:['Library','Typed values','Efficiencies','Full loss maps'],rb:true},
    {k:'dragN',l:'Constant drag at the wheel',t:'num',u:'N',req:true,show:isAny('lossHow',['Typed values','Efficiencies'])},
    {k:'effDrive',l:'Drive efficiency',t:'num',u:'%',req:true,show:is('lossHow','Efficiencies')},
    {k:'effRegen',l:'Regeneration efficiency',t:'num',u:'%',req:true,show:is('lossHow','Efficiencies')},
    {k:'mapAxle',l:'Axle ratio and loss map',t:'file',req:true,show:is('lossHow','Full loss maps')},
    {k:'mapGear',l:'Gear ratios and loss maps',t:'file',req:true,show:is('lossHow','Full loss maps')},
    {k:'mapMotor',l:'Motor map and limit curves',t:'file',req:true,show:is('lossHow','Full loss maps')}],
   x:[{k:'pDriver',l:'Motor power for the driver',t:'num',u:'kW'},{k:'rotorJ',l:'Rotor inertia',t:'num',u:'kg·m²'},
      {k:'iTot',l:'Total ratio, motor to wheel',t:'num'},{k:'coastTbl',l:'Coasting drag by speed',t:'table',cols:[{k:'v',l:'Speed',t:'num',u:'km/h'},{k:'f',l:'Force',t:'num',u:'N'}]},
      {k:'vacc',l:'Acceleration and braking limits',t:'table',cols:[{k:'v',l:'Speed',t:'num',u:'km/h'},{k:'a',l:'Acceleration',t:'num',u:'m/s²'},{k:'d',l:'Braking',t:'num',u:'m/s²'}]}]},
  {id:'battery',title:'Battery',bat:true,f:[
    {k:'batMode',l:'Battery',t:'select',o:['I have a battery','Size it for me'],req:true,rb:true},
    {k:'batInst',l:'Installed energy',t:'num',u:'kWh',req:true,show:is('batMode','I have a battery')},
    {k:'batUse',l:'Usable energy',t:'num',u:'kWh',show:is('batMode','I have a battery')},
    {k:'batMass',l:'Battery weight',t:'num',u:'kg',show:is('batMode','I have a battery')},
    {k:'glider',l:'Truck weight without battery',t:'num',u:'kg',req:true,show:is('batMode','Size it for me')},
    {k:'density',l:'Pack energy density',t:'num',u:'kWh/kg',req:true,show:is('batMode','Size it for me')},
    {k:'sizeStep',l:'Battery sizes',t:'select',o:['Continuous','Real pack sizes'],show:is('batMode','Size it for me')},
    {k:'socBuf',l:'SOC buffer',t:'num',u:'%',show:is('batMode','Size it for me')},
    {k:'dcMax',l:'Fastest DC charging',t:'num',u:'kW'},
    {k:'conn',l:'Connector',t:'select',o:['CCS2','MCS']},
    {k:'socLo',l:'Lowest SOC allowed',t:'num',u:'%'},
    {k:'socHi',l:'Highest SOC allowed',t:'num',u:'%'},
    {k:'socStart',l:'SOC at first departure',t:'num',u:'%'},
    {k:'socTarget',l:'Target SOC',t:'num',u:'%'},
    {k:'batHeat',l:'Battery heating and conditioning',t:'num',u:'W'}],
   x:[{k:'vNom',l:'Nominal voltage',t:'num',u:'V'},{k:'chem',l:'Chemistry',t:'select',o:['LFP','NMC','Other']},
      {k:'ocv',l:'Open-circuit voltage by SOC',t:'table',cols:[{k:'s',l:'SOC',t:'num',u:'%'},{k:'v',l:'Voltage',t:'num',u:'V'}]},
      {k:'ri',l:'Internal resistance by pulse',t:'table',cols:[{k:'s',l:'Pulse',t:'num',u:'s'},{k:'r',l:'Resistance',t:'num',u:'mΩ·Ah'}]},
      {k:'cRate',l:'Charging curve',t:'table',cols:[{k:'s',l:'SOC',t:'num',u:'%'},{k:'p',l:'Power',t:'num',u:'kW'}]}]},
  {id:'ageing',title:'Battery ageing',bat:true,f:[
    {k:'guar',l:'Usable capacity guaranteed at check year',t:'num',u:'%',nd:true},
    {k:'checkYear',l:'Check year',t:'num'},
    {k:'warrY',l:'Warranty',t:'num',u:'years',nd:true},
    {k:'warrKm',l:'Warranty',t:'num',u:'km',nd:true},
    {k:'soh',l:'State of health by year',t:'table',nd:true,cols:[{k:'y',l:'Year',t:'num'},{k:'s',l:'State of health',t:'num',u:'%'}]},
    {k:'passport',l:'Battery passport file',t:'file',nd:true}]},
  {id:'cab',title:'Cab climate',f:[
    {k:'hvMode',l:'Cab climate',t:'select',o:['VECTO standard value','Own constant','Thermal model'],rb:true},
    {k:'hvW',l:'Cab climate power',t:'num',u:'W',req:true,show:is('hvMode','Own constant')},
    {k:'persons',l:'People in the cab',t:'num',req:true,show:is('hvMode','Thermal model')},
    {k:'hpType',l:'Heat pump',t:'select',o:['None','R-744','Non R-744 2-stage','Non R-744 3-stage','Non R-744 4-stage','Non R-744 continuous'],req:true,show:is('hvMode','Thermal model')},

    sec.f.forEach(function(f){if(!vis(f,obj)||f.t==='auto')return;if(!empty(obj[f.k]))return;
      if(isReq(f,obj))red(G,f.l+' missing',go(f.k),id);else if(!f.nd){def++;first=first||f.k}});
    if(def)yel(G,sec.title+': '+def+' default'+(def>1?'s':'')+' used',go(first),id)})}
  if(active('fleet')){
    if(!S.groups.length)red('Fleet','Add at least one fleet group',function(){goPage('fleet')});
    S.groups.forEach(function(g,i){var n=g.name||'Group '+(i+1);
      [['vehicle','vehicle'],['schedule','schedule']].concat(P.start===2?[]:[['route','route']]).forEach(function(p){
        if(!g[p[0]])red('Fleet',n+': '+p[1]+' not chosen',function(){goCell(g.id+'.'+p[0])})});
      if(P.start===2&&empty(g.kwhDay))red('Fleet',n+': energy per day missing',function(){goCell(g.id+'.kwhDay')});
      if(!(+g.count>0))red('Fleet',n+': number of vehicles missing',function(){goCell(g.id+'.count')})});
  }
  if(active('vehicles')){
    if(!S.vehicles.length&&!active('fleet'))red('Vehicles','Add at least one vehicle',function(){goPage('vehicles')});
    S.vehicles.forEach(function(v){var G='Vehicle · '+(v.name||'Unnamed');
      function go(k){return function(){goObj('vehicles','selVeh',v.id,'v.'+k)}}
      if(empty(v.name))red(G,'Name missing',go('name'),v.id);
      if(empty(v.group)&&!batOnly())red(G,'Vehicle group missing',go('group'),v.id);
      secs(G,v,VSEC.filter(function(s){return !batOnly()||s.bat}),go,v.id);
      if(empty(v.guar))yel(G,'Year-8 check: guarantee not given',go('guar'),v.id);
    });
  }
  if(active('routes'))S.routes.forEach(function(r){var G='Route · '+(r.name||'Unnamed');
    function go(k){return function(){goObj('routes','selRoute',r.id,/^s\d+\./.test(k)?k:'r.'+k)}}
    if(r.builtin){if(S.groups.some(function(g){return g.route===r.id}))secs(G,r,[ROUTE_PAYLOAD],go,r.id);return}
    if(empty(r.name))red(G,'Route name missing',go('name'),r.id);
    if(r.how==='Totals only')secs(G,r,[ROUTE_TOTALS],go,r.id);
    else{
      if(!r.stops.length)red(G,'Add at least one stop',go('name'),r.id);
      var nd=0,fs='';
      r.stops.forEach(function(s,i){var n=i+1;
        if(empty(s.km))red(G,'Stop '+n+': distance missing',go('s'+n+'.km'),r.id);
        if(empty(s.road))red(G,'Stop '+n+': road type missing',go('s'+n+'.road'),r.id);
        if(r.plShape==='Per stop'&&empty(s.pl))red(G,'Stop '+n+': payload missing',go('s'+n+'.pl'),r.id);
        if(empty(s.dwell)||empty(s.grade)){nd++;fs=fs||('s'+n+'.'+(empty(s.dwell)?'dwell':'grade'))}});
      if(empty(r.backKm))red(G,'Distance back at the depot missing',go('backKm'),r.id);
      if(nd)yel(G,'Stops: '+nd+' with default time at stop or grade',go(fs),r.id);
    }
    secs(G,r,[ROUTE_PAYLOAD,ROUTE_MORE],go,r.id);
  });
  if(active('ops'))S.schedules.forEach(function(s){var G='Schedule · '+(s.name||'Unnamed');
    function go(k){return function(){goObj('ops','selSched',s.id,'sc.'+k)}}
    if(empty(s.name))red(G,'Schedule name missing',go('name'),s.id);
    if(!s.days.some(Boolean))red(G,'No working days chosen',go('days'),s.id);
    secs(G,s,[SCHED],go,s.id)});
  function pg(page,prefix){return function(k){return function(){goPage(page);flash('[data-k="'+prefix+k+'"]')}}}
  if(active('weather'))secs('Weather',S.wx,WX,pg('weather','wx.'));
  if(active('depot'))secs('Depot & charging',S.dep,DEP,pg('depot','dep.'));
  if(active('costs'))secs('Costs',S.cost,COST,pg('costs','cost.'));
  if(active('tender'))secs('Tender',S.ten,TEN,pg('tender','ten.'));
  return {R:R,Y:Y};
}
function updateCheck(){CK=compute();$('#nr').textContent=CK.R.length;$('#na').textContent=CK.Y.length;$('#run').classList.toggle('off',CK.R.length>0);if(!$('#panel').hidden)drawPanel()}
function drawPanel(){
  function sec(title,items,cls){var w=el('div',{class:'psec'},el('h3',{},el('span',{class:'dot '+cls}),title+' ('+items.length+')'));
    if(!items.length)w.append(el('p',{class:'note',style:'margin:0'},cls==='r'?'Nothing missing.':'No defaults in use.'));
    var by={},order=[];items.forEach(function(i){if(!by[i.g]){by[i.g]=[];order.push(i.g)}by[i.g].push(i)});
    order.forEach(function(g){add(w,el('div',{class:'pg-h'},g));add(w,by[g].map(function(i){return el('button',{class:'pitem',type:'button',onclick:function(){$('#panel').hidden=true;i.go()}},i.text)}))});
    return w}
  fill($('#panel'),sec('Needed before Run',CK.R,'r'),sec('Defaults or no data given',CK.Y,'a'));
}
function openPanel(){$('#panel').hidden=false;$('#menu').hidden=true;drawPanel()}
function goPage(p){S.page=p;save();render()}
function goCell(k){goPage('fleet');flash('[data-k="'+k+'"]')}
function goObj(page,sel,id,k){S.page=page;S[sel]=id;save();render();flash('[data-k="'+k+'"]')}

/* ======================= SHELL ======================= */
function render(){
  rebuildHook=null;
  if(!P.tender&&S.page==='tender')S.page='fleet';
  fill($('#nav'),PAGES.filter(function(p){return p[0]!=='tender'||P.tender}).map(function(p){
    return el('button',{type:'button',class:active(p[0])?'':'off','aria-current':p[0]===S.page?'page':null,onclick:function(){goPage(p[0])}},p[1])}));
  updateCheck();
  var page;
  if(!active(S.page)){
    page=el('div',{class:'pg'},el('h1',{},PAGES.find(function(p){return p[0]===S.page})[1]),
      el('div',{class:'card'},el('p',{style:'margin-top:0'},'Not needed when you start from “'+STARTS[P.start-1][1]+'”. Anything typed here is kept.'),el('button',{class:'btn',type:'button',onclick:openSetup},'Change start')));
  }else page=PAGEFN[S.page]();
  fill($('#page'),page);
}
$('#pname').value=P.name;
$('#pname').addEventListener('input',function(e){P.name=e.target.value;save()});
$('#ckb').addEventListener('click',function(e){e.stopPropagation();if($('#panel').hidden)openPanel();else $('#panel').hidden=true});
$('#run').addEventListener('click',function(e){e.stopPropagation();
  if(CK.R.length){openPanel();toast(CK.R.length+' needed before Run')}else{goPage('results');toast('The engine is not connected in this prototype')}});
$('#more').addEventListener('click',function(e){
  e.stopPropagation();var m=$('#menu');$('#panel').hidden=true;if(!m.hidden){m.hidden=true;return}
  var nb=el('button',{type:'button'},'New project');armed(nb,'Click again to clear everything',function(){P=freshProject();S=P.scen[P.active].d;selected={};$('#pname').value='';save();m.hidden=true;drawScen();render();openSetup()});
  fill(m,el('button',{type:'button',onclick:function(){m.hidden=true;openSetup()}},'Project setup'),nb,
    el('button',{type:'button',onclick:function(){m.hidden=true;var t=JSON.stringify(P);
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Project data copied')},function(){var ta=el('textarea',{readonly:true});ta.value=t;modal('Project data',ta,null);ta.select()})}},'Copy project data'),
    el('button',{type:'button',onclick:function(){m.hidden=true;var ta=el('textarea',{placeholder:'Paste project data'});
      modal('Open project data',ta,function(close){return [el('span',{class:'sp'}),el('button',{class:'btn primary',type:'button',onclick:function(){
        try{var j=JSON.parse(ta.value);if(!(j&&j.scen&&j.scen[j.active]))throw 0;P=j;S=P.scen[P.active].d;$('#pname').value=P.name||'';save();close();drawScen();render()}catch(err){toast('That is not project data')}}},'Open')]})}},'Open project data'));
  m.hidden=false;
});
document.addEventListener('click',function(e){if(!e.target.closest('#panel'))$('#panel').hidden=true;if(!e.target.closest('#menu'))$('#menu').hidden=true});
drawScen();render();
if(P.isNew)openSetup();
})();
</script>
