<title>EV Scope prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: desktop-class workbench. Menu row + project row on top, project index left, one sheet centre, one side panel right. */
:root{
  --bg:#F5F6F8; --paper:#FFFFFF; --sunk:#EEF0F4; --ink:#1A1F2B; --ink2:#4A5262; --ink3:#7A8293; --line:#D9DDE4; --line2:#E8EBF0;
  --accent:#1F4E9E; --accent-ink:#FFFFFF; --accent-soft:#E6EDF8; --good:#2E7D4F; --bad:#B3261E; --bad-soft:#FBEDEC; --warn:#8A5A00;
  --shadow-up:0 1px 2px rgba(20,30,50,.10),0 2px 6px rgba(20,30,50,.06); --shadow-in:inset 0 1px 2px rgba(20,30,50,.10);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161D; --paper:#1A1F28; --sunk:#151A22; --ink:#E7EAF0; --ink2:#B4BBC8; --ink3:#8A93A3; --line:#2F3744; --line2:#262D38;
  --accent:#6E9BE6; --accent-ink:#0E1420; --accent-soft:#1F2C44; --good:#5DBB84; --bad:#F08A80; --bad-soft:#3A1F1E; --warn:#E0B259;
  --shadow-up:0 1px 2px rgba(0,0,0,.4); --shadow-in:inset 0 1px 2px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161D; --paper:#1A1F28; --sunk:#151A22; --ink:#E7EAF0; --ink2:#B4BBC8; --ink3:#8A93A3; --line:#2F3744; --line2:#262D38;
  --accent:#6E9BE6; --accent-ink:#0E1420; --accent-soft:#1F2C44; --good:#5DBB84; --bad:#F08A80; --bad-soft:#3A1F1E; --warn:#E0B259;
  --shadow-up:0 1px 2px rgba(0,0,0,.4); --shadow-in:inset 0 1px 2px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
#app{height:100%;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* buttons: raised */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 12px;box-shadow:var(--shadow-up);white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:600;margin-left:6px}
.badge.ok{background:var(--sunk);color:var(--ink3)}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.02em;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink3);vertical-align:1px;white-space:nowrap}
.tag.dash{border-style:dashed}

/* menu row */
.menurow{display:flex;align-items:center;gap:2px;height:38px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 12px;background:var(--paper);border-bottom:1px solid var(--line2);position:relative;z-index:30}
.brand{font-weight:700;letter-spacing:-.01em;margin-right:14px;display:flex;align-items:center;gap:8px}
.brand i{width:18px;height:18px;border-radius:4px;background:var(--accent);display:inline-block}
.menu{position:relative}
.menu>button{border:0;background:none;padding:6px 9px;border-radius:5px;color:var(--ink2);font-size:13.5px}
.menu>button:hover,.menu.open>button{background:var(--sunk);color:var(--ink)}
.dd{position:absolute;top:34px;left:0;min-width:250px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(20,30,50,.18);padding:5px;display:none}
.menu.open .dd{display:block}
.dd button{display:flex;justify-content:space-between;gap:20px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px;font-size:13.5px}
.dd button:hover{background:var(--accent-soft)}
.dd button kbd{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.dd button.on::before{content:"✓";position:absolute;margin-left:-12px;color:var(--accent)}
.dd hr{border:0;border-top:1px solid var(--line2);margin:4px 6px}
.dd .dis{color:var(--ink3)}
.findwrap{margin-left:auto;position:relative}
.find{width:280px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--sunk);box-shadow:var(--shadow-in)}
.findres{position:absolute;right:0;top:36px;width:420px;max-height:60vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(20,30,50,.18);display:none;z-index:40}
.findres.show{display:block}
.findres button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-bottom:1px solid var(--line2)}
.findres button:hover,.findres button.hl{background:var(--accent-soft)}
.findres small{display:block;color:var(--ink3);font-size:12px}
.menubtn{display:none}

/* project row */
.projrow{display:flex;align-items:center;gap:14px;min-height:58px;padding:6px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
.ident{min-width:0}
.ident b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.ident span{font-size:12px;color:var(--ink3)}
.save{font-size:12px;color:var(--ink3);white-space:nowrap}
.save.err{color:var(--bad)}
.stages{display:flex;margin:0 auto;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--paper)}
.stage{padding:5px 12px;border-right:1px solid var(--line2);line-height:1.25;border:0;border-right:1px solid var(--line2);background:none;text-align:left}
.stage:last-child{border-right:0}
.stage b{display:block;font-size:12px;font-weight:600}
.stage span{display:block;font-size:11px;color:var(--ink3)}
.stage.s-done span{color:var(--good)}.stage.s-run span{color:var(--accent)}.stage.s-stale span{color:var(--warn)}.stage.s-sup span{color:var(--ink2)}
.stage.s-unused{opacity:.55}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sunk);box-shadow:var(--shadow-in)}
.seg button{border:0;background:none;padding:5px 10px;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-up);font-weight:600}

/* body */
.work{flex:1;display:flex;min-height:0;position:relative}
nav.index{width:268px;flex:none;background:var(--paper);border-right:1px solid var(--line);overflow:auto;padding:6px 0 30px}
.grp{padding:12px 16px 3px}
.grp b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.grp span{display:block;font-size:11.5px;color:var(--ink3)}
.it{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;border:0;background:none;text-align:left;padding:5px 16px 5px 22px;font-size:13.5px;border-left:3px solid transparent;color:var(--ink)}
.it:hover{background:var(--sunk)}
.it em{font-style:normal;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.it em.miss{color:var(--bad);font-weight:600}
.it.unused{color:var(--ink3)}
.it.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.divide{border-top:1px solid var(--line);margin:12px 16px 2px}

.sheet{flex:1;min-width:0;overflow:auto;padding:24px 32px 90px}
.col{max-width:960px}
.crumb{font-size:12.5px;color:var(--ink3);margin-bottom:4px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.lead{color:var(--ink2);margin:0 0 16px;max-width:68ch}
.banner{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:12px 16px;margin:0 0 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;color:var(--ink2);max-width:70ch}
.banner.info{border-left:4px solid var(--accent)}
.banner.warn{border-left:4px solid var(--warn)}
.objbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 20px}
.objbar .lbl{font-size:12.5px;color:var(--ink3);margin-right:2px}
.chip{border:1px solid var(--line);border-radius:16px;padding:4px 12px;background:var(--paper);font-size:13px;box-shadow:var(--shadow-up)}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.add{border-style:dashed;box-shadow:none;color:var(--ink2)}
section.card{background:var(--paper);border:1px solid var(--line2);border-radius:10px;padding:16px 20px 10px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 small{font-weight:400;font-size:12px;color:var(--ink3)}
.fld{display:grid;grid-template-columns:minmax(180px,250px) minmax(0,1fr);column-gap:20px;padding:9px 0;border-top:1px solid var(--line2);align-items:start}
.fld:first-of-type{border-top:0}
.lab{padding-top:6px;color:var(--ink2);font-size:13.5px;cursor:help}
.lab .req{display:block;font-size:11.5px;color:var(--ink3)}
.lab .req.miss{color:var(--bad)}
.ctl{min-width:0}
.in{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--sunk);box-shadow:var(--shadow-in);height:34px;min-width:170px;max-width:100%}
.in input,.in select{border:0;background:transparent;height:100%;padding:0 10px;min-width:0;flex:1;font-variant-numeric:tabular-nums;outline:none}
.in u{text-decoration:none;color:var(--ink3);font-size:12.5px;padding-right:10px;white-space:nowrap}
.in.wide{width:360px}
.in:focus-within{border-color:var(--accent);box-shadow:var(--shadow-in),0 0 0 3px var(--accent-soft)}
.in.edited input{color:var(--accent)}
.in.miss{border-color:var(--bad);background:var(--bad-soft)}
.in.wrong{border-color:var(--bad)}
.in.def input::placeholder{color:var(--ink3);font-style:italic}
.mark{font-size:10.5px;color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:8px}
.reset{border:0;background:none;color:var(--ink3);font-size:12px;padding:0 8px;text-decoration:underline}
.msg{font-size:12px;margin-top:4px;color:var(--ink3)}
.msg.err{color:var(--bad)}
textarea.in{display:block;width:100%;max-width:560px;height:84px;padding:8px 10px;resize:vertical;font-family:var(--mono);font-size:12.5px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 11px;max-width:330px;text-align:left;box-shadow:var(--shadow-up);font-size:13px;line-height:1.3}
.opt i{width:14px;height:14px;border:1.5px solid var(--ink3);border-radius:50%;flex:none;margin-top:1px}
.opt.sq i{border-radius:3px}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt.on i{border-color:var(--accent);background:radial-gradient(var(--accent) 46%,transparent 52%)}
.opt.sq.on i{background:var(--accent)}
.opts.miss .opt{border-color:var(--bad)}
.sub{margin-top:8px}
.filled{display:inline-flex;align-items:center;height:34px;padding:0 10px;border-radius:6px;background:var(--sunk);color:var(--ink3);font-size:12.5px;border:1px dashed var(--line)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;max-width:520px;color:var(--ink2);font-size:13px;display:flex;gap:12px;align-items:center;background:var(--paper)}
.mapbox{height:150px;max-width:560px;border:1px solid var(--line);border-radius:8px;background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 10px,var(--bg) 10px,var(--bg) 20px);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:13px;text-align:center;padding:10px}
details.more{border:1px solid var(--line2);border-radius:8px;margin:6px 0 10px;background:var(--bg)}
details.more>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"Show";color:var(--accent);font-size:12.5px}
details.more[open]>summary::after{content:"Hide"}
details.more>summary span{color:var(--ink3);font-size:12.5px;margin-left:auto}
details.more[open]>summary{border-bottom:1px solid var(--line2)}
details.more .inner{padding:2px 14px 6px;background:var(--paper);border-radius:0 0 8px 8px}
.expert{border-left:3px solid var(--ink3);padding-left:14px;margin:8px 0 10px}
.expert h3{margin:6px 0 0;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.note{font-size:12.5px;color:var(--ink3);margin:6px 0 8px}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th{text-align:left;font-weight:600;font-size:12px;color:var(--ink2);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:4px 6px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;vertical-align:middle}
table.grid td input,table.grid td select{width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:4px}
table.grid td input:focus,table.grid td select:focus{border-color:var(--accent);background:var(--paper);outline:none}
table.grid td.num,table.grid th.num{text-align:right}
.tblwrap{overflow-x:auto}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px;color:var(--ink2);background:var(--paper);text-align:center}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}

/* findings */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line2);border-radius:10px;padding:14px 16px}
.kpi .v{font-size:28px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:500;margin-left:4px}
.kpi .t{font-size:13px;color:var(--ink2);margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--ink3);margin-top:8px}
.rline{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:8px 0;border-top:1px solid var(--line2);font-size:13.5px}
.rline:first-of-type{border-top:0}
.rline span{color:var(--ink3);font-size:12.5px;text-align:right}
.chartph{height:120px;border:1px solid var(--line2);border-radius:8px;margin:6px 0 14px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:12.5px;background:linear-gradient(transparent calc(100% - 1px),var(--line2) 0) 0 0/100% 24px;text-align:center;padding:10px}

/* side panel */
aside.panel{width:360px;flex:none;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside.panel[hidden]{display:none}
.ptabs{display:flex;border-bottom:1px solid var(--line);align-items:center}
.ptabs button{border:0;background:none;padding:10px 12px;color:var(--ink3);font-size:13.5px}
.ptabs button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.ptabs .x{margin-left:auto}
.pbody{padding:14px 16px;overflow:auto;flex:1}
.pbody h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:16px 0 6px}
.pbody h4:first-child{margin-top:0}
.issue{display:block;width:100%;text-align:left;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:var(--paper)}
.issue:hover{border-color:var(--accent)}
.issue small{display:block;color:var(--ink3);font-size:11.5px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:12.5px}
.kv b{color:var(--ink2);font-weight:500}

/* home / chooser */
.home{flex:1;overflow:auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.home .col{max-width:1120px;margin:0 auto}
.homehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.homehead h1{margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plist{background:var(--paper);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.plist table{width:100%;border-collapse:collapse}
.plist th{font-size:12px;font-weight:600;color:var(--ink2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.plist td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:13.5px}
.plist tr.row:hover td{background:var(--sunk);cursor:pointer}
.plist td small{display:block;color:var(--ink3);font-size:12px}
.dots{display:inline-flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}.dots i.on{background:var(--good);border-color:var(--good)}
.starts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:12px 0 22px}
.start{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--paper);text-align:left;box-shadow:var(--shadow-up);display:flex;flex-direction:column;gap:6px}
.start b{font-size:15px}.start span{color:var(--ink2);font-size:13px}.start em{font-style:normal;color:var(--ink3);font-size:12px;margin-top:auto}
.start.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.formrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 18px;margin-bottom:8px}
.formrow label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.formrow .in{width:100%}

/* dialog + toast */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.dlg{background:var(--paper);border-radius:12px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.dlg h3{margin:0 0 8px;font-size:18px}
.dlg p{color:var(--ink2);margin:0 0 10px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.proto{font-size:11.5px;color:var(--ink3);background:var(--sunk);border-bottom:1px solid var(--line2);padding:3px 12px}

@media (max-width:1360px){.stage span{display:none}.stage{padding:8px 10px}.find{width:200px}aside.panel{position:absolute;right:0;top:0;bottom:0;box-shadow:-10px 0 24px rgba(20,30,50,.12);z-index:20}}
@media (max-width:1100px){.stages{display:none}}
@media (max-width:760px){
  .menu,.findwrap,.seg,.save,#btnCheck .lbl{display:none}
  .menubtn{display:inline-block;margin-left:auto}
  nav.index{position:absolute;inset:0;width:auto;z-index:15;display:none}
  nav.index.show{display:block}
  .sheet{padding:16px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
  .fld{grid-template-columns:1fr}.lab{padding-top:0;margin-bottom:6px}
  .in.wide{width:100%}
  aside.panel{width:100%}
  .plist .hide-s{display:none}
  .ident b{max-width:170px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

   h+=`<details class="more" data-more="${esc(sec+sc)}" ${open?"open":""}><summary><b>More: ${esc(sec.toLowerCase())}</b><span>${more.length} values${missN?` · <span style="color:var(--bad)">${missN} required</span>`:" · defaults are used unless you change them"}</span></summary><div class="inner">${more.map(x=>fieldHTML(x,sc,ck)).join("")}</div></details>`}
  if(exp.length)h+=`<div class="expert"><h3>Engineering detail · ${exp.length}</h3>${exp.map(x=>fieldHTML(x,sc,ck)).join("")}</div>`;

function stopTable(sc){const p=P();const src=getV("rt.source",sc);const n=parseInt(String(getV("rt.n_stops",sc)||"").replace(/\D/g,""),10);

 for(let i=0;i<rows;i++){h+=`<tr><td class="num">${i+1}</td>${cols.map(c=>{const val=(data[i]||{})[c.id];return c.t==="cb"||/payload changes|pto/i.test(c.label)?`<td><input type="checkbox" data-stop="${i}" data-col="${esc(c.id)}" data-sc="${esc(sc)}" ${val?"checked":""} style="width:auto"></td>`:`<td><input data-stop="${i}" data-col="${esc(c.id)}" data-sc="${esc(sc)}" value="${esc(val??"")}" placeholder="${c.req==="default"||c.req.startsWith("default")?"default":""}"></td>`}).join("")}</tr>`}

function ledger(){const p=P();let rows=[];

  const n=document.getElementById("cname").value.trim();if(!n){document.getElementById("cname").focus();return toast("Give the project a name")}const p=newProject(n,document.getElementById("cclient").value.trim(),S.chooser.start);DB.projects.push(p);persist();return openProject(p.id)}
 if(el=q("importok")){const o=S.importRes.data;const p=newProject(o.name||"Imported project",o.client||"",o.start||1);const known=new Set(ALLIN.map(x=>x.id));
  for(const k of ["objects","groups","stops"])if(o[k])p[k]=o[k];p.values={};for(const sc in (o.values||{})){p.values[sc]={};for(const k in o.values[sc])if(known.has(k))p.values[sc][k]=o.values[sc][k]}p.name=(o.name||"Imported project")+" (imported)";DB.projects.push(p);persist();S.importRes=null;return openProject(p.id)}
 if(el=q("page")){S.page=el.dataset.page;S.navShow=false;document.getElementById("sheet")&&(document.getElementById("sheet").scrollTop=0);return render()}
 if(el=q("togglenav")){S.navShow=!S.navShow;return render()}
 if(el=q("view")){S.view=el.dataset.view;return render()}
 if(el=q("panel")){S.panel=el.dataset.panel;return render()}
 if(el=q("closepanel")){S.panelOpen=false;return render()}
 if(el=q("stage")){const k=el.dataset.stage,[s]=stageState(k,check());const M={"Not available yet":"This stage of the engine is planned and not built yet.","You supplied this":"You gave this stage's result directly, so it is not modelled.","Not used":"This project starts at a later stage.","Ready":"Everything needed is filled in. Press Run.","Modelled":"Worked out in the last run.","Out of date":"An input changed after the last run. Run again.","Running…":"In progress."};return dialog(STAGES.find(x=>x[0]===k)[1]+": "+s,`<p>${M[s]||"Something still needs fixing. Press Check to see what."}</p><p class="note">The stage strip explains; it is not a way to move around. Use the index on the left.</p>`)}
 if(el=q("jump")){const ck=check(),j=el.dataset.jump,m=j[0]==="m"?ck.miss[+j.slice(1)]:ck.wrong[+j.slice(1)];if(m.group){S.page="Duties / Fleet groups";return render()}const o=OBJ[m.inp.page];if(o)S.obj[o[0]]=m.sc;return goField(m.inp.id)}
 if(el=q("findgo"))return goField(el.dataset.findgo);
 if(el=q("help")){S.focus=el.dataset.help;if(!S.panelOpen||!["sources","help"].includes(S.panel)){S.panel="sources"}S.panelOpen=true;return render()}
 if(el=q("obj")){S.obj[el.dataset.obj]=el.dataset.oid;return render()}
 if(el=q("addobj")){const k=el.dataset.addobj,p=P(),o=Object.values(OBJ).find(x=>x[0]===k);pushUndo();const n={id:uid(),name:`${o[2]} ${p.objects[k].length+1}`};p.objects[k].push(n);S.obj[k]=n.id;touched();return render()}
 if(el=q("renobj")){const k=el.dataset.renobj,p=P(),cur=p.objects[k].find(x=>x.id===S.obj[k]);return dialog("Rename",`<span class="in" style="width:100%"><input id="rn" value="${esc(cur.name)}"></span>`,[["Cancel"],["Rename",d=>{cur.name=d.querySelector("#rn").value.trim()||cur.name;touched();render()},"primary"]])}
 if(el=q("dupobj")){const k=el.dataset.dupobj,p=P(),cur=p.objects[k].find(x=>x.id===S.obj[k]);pushUndo();const n={id:uid(),name:cur.name+" (copy)"};p.objects[k].push(n);p.values[n.id]=JSON.parse(JSON.stringify(p.values[cur.id]||{}));if(p.stops[cur.id])p.stops[n.id]=JSON.parse(JSON.stringify(p.stops[cur.id]));S.obj[k]=n.id;touched();return render()}
 if(el=q("delobj")){const k=el.dataset.delobj,p=P(),cur=p.objects[k].find(x=>x.id===S.obj[k]);const n=p.groups.filter(g=>g[k]===cur.id).length;if(n)return dialog("Cannot delete",`<p>“${esc(cur.name)}” is used by ${n} fleet group${n>1?"s":""}. Pick another for ${n>1?"them":"it"} first.</p>`);return dialog(`Delete “${cur.name}”?`,"<p>Its values are removed. You can undo this.</p>",[["Cancel"],["Delete",()=>{pushUndo();p.objects[k]=p.objects[k].filter(x=>x!==cur);delete S.obj[k];touched();render()},"danger"]])}
 if(el=q("addgroup")){const p=P();pushUndo();p.groups.push({id:uid(),name:`Group ${p.groups.length+1}`,count:1,veh:p.objects.veh[0]?.id,rt:p.objects.rt[0]?.id,pl:p.objects.pl[0]?.id,sch:p.objects.sch[0]?.id});touched();return render()}
 if(el=q("delgroup")){const p=P();pushUndo();p.groups=p.groups.filter(g=>g.id!==el.dataset.delgroup);touched();return render()}
 if(el=q("setstart")){const p=P();pushUndo();p.start=+el.dataset.setstart;touched();render();return toast("Start point changed")}
 if(el=q("gostart"))return act("start");
 if(el=q("run"))return doRun();
 if(el=q("reset")&&el.dataset.reset){setV(el.dataset.reset,el.dataset.sc,undefined);return render()}
 if(el=q("addrow")){const id=el.dataset.id,sc=el.dataset.sc,v=(P().values[sc]||{})[id];setV(id,sc,(v?v+"\n":"\n"));return render()}
 if(el=q("delrow")){const id=el.dataset.id,sc=el.dataset.sc,rows=String((P().values[sc]||{})[id]||"").split("\n");rows.splice(+el.dataset.delrow,1);setV(id,sc,rows.join("\n"));return render()}
 if(el=t.closest("[data-k]")){const id=el.dataset.id,sc=el.dataset.sc,k=el.dataset.k,cur=(P().values[sc]||{})[id];
  if(k==="opt"){setV(id,sc,cur===+el.dataset.i?undefined:+el.dataset.i);S.focus=id;return render()}
  if(k==="multi"){const a=new Set(cur||[]);const i=+el.dataset.i;a.has(i)?a.delete(i):a.add(i);setV(id,sc,[...a].sort());S.focus=id;return render()}
  if(k==="bool"){setV(id,sc,!cur);S.focus=id;return render()}
  if(k==="src"){const i=+el.dataset.i;setV(id,sc,cur&&cur.c===i?undefined:{c:i});S.focus=id;return render()}}
 if(t.closest("details.more>summary")){const d=t.closest("details");S.openMore=S.openMore||{};S.openMore[d.dataset.more]=!d.open}
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.g){const p=P(),g=p.groups.find(x=>x.id===t.dataset.g);pushUndo();g[t.dataset.gk]=t.dataset.gk==="count"?t.value.replace(/\D/g,""):t.value;touched();return render()}
 if(t.dataset.stop!==undefined){const p=P(),sc=t.dataset.sc;pushUndo();const d=(p.stops[sc]=p.stops[sc]||{});(d[t.dataset.stop]=d[t.dataset.stop]||{})[t.dataset.col]=t.type==="checkbox"?t.checked:t.value;touched();return}
 if(t.dataset.k==="file"){setV(t.dataset.id,t.dataset.sc,t.files[0]?.name);return render()}
 if(t.dataset.k==="cell"){const id=t.dataset.id,sc=t.dataset.sc,rows=String((P().values[sc]||{})[id]||"").split("\n").map(r=>r.split("\t"));const r=+t.dataset.r,c=+t.dataset.c;while(rows.length<=r)rows.push([]);rows[r][c]=t.value;setV(id,sc,rows.map(x=>x.join("\t")).join("\n"));return render()}
 if(t.dataset.k==="v"){setV(t.dataset.id,t.dataset.sc,t.value.trim()===""?undefined:t.value);S.focus=t.dataset.id;const keep=t.id;render();return}
 if(t.dataset.k==="srcv"){const cur=(P().values[t.dataset.sc]||{})[t.dataset.id]||{};setV(t.dataset.id,t.dataset.sc,{c:cur.c,v:t.value});return render()}
});
document.addEventListener("paste",e=>{const t=e.target;if(t.dataset&&t.dataset.k==="cell"){const txt=(e.clipboardData||window.clipboardData).getData("text");if(!txt.includes("\t")&&!txt.includes("\n"))return;e.preventDefault();const id=t.dataset.id,sc=t.dataset.sc,r0=+t.dataset.r,c0=+t.dataset.c;
 const rows=String((P().values[sc]||{})[id]||"").split("\n").map(r=>r.split("\t"));txt.replace(/\r/g,"").split("\n").filter(Boolean).forEach((line,i)=>{const cells=line.split("\t");while(rows.length<=r0+i)rows.push([]);cells.forEach((v,j)=>rows[r0+i][c0+j]=v)});setV(id,sc,rows.map(x=>x.join("\t")).join("\n"));render();toast("Pasted "+txt.split("\n").filter(Boolean).length+" rows")}});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="find"){S.find=t.value;showFind()}if(t.id==="homeq"){S.homeq=t.value;const pos=t.selectionStart;render();const n=document.getElementById("homeq");n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener("keydown",e=>{const mod=e.ctrlKey||e.metaKey;
 if(e.key==="Escape"){document.querySelectorAll(".menu.open").forEach(x=>x.classList.remove("open"));if(S.find){S.find="";render()}else if(S.panelOpen&&!document.querySelector(".scrim")){S.panelOpen=false;render()}const sc=document.querySelector(".scrim");sc&&sc.remove();return}
 if(e.target.id==="find"&&e.key==="Enter"){const b=document.querySelector("#findres [data-findgo]");b&&goField(b.dataset.findgo);return}
 if(S.screen!=="project"||!mod)return;
 if(e.key.toLowerCase()==="k"){e.preventDefault();act("find")}
 else if(e.key.toLowerCase()==="z"&&!(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")){e.preventDefault();e.shiftKey?redo():undo()}
 else if(e.key.toLowerCase()==="s"){e.preventDefault();act("save")}
 else if(e.key==="Enter"){e.preventDefault();act(e.shiftKey?"check":"run")}});
render();
</script>
